name: 🚣 Erg Trainer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'erg-web/**'
      - '.github/workflows/erg-web.yml'
  push:
    branches: [ master ]
    paths:
      - 'erg-web/**'
      - '.github/workflows/erg-web.yml'

jobs:
  test:
    name: 🧪 Test the Erg Trainer web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erg-web
    steps:
      - name: ⤵ Checkout the code
        uses: actions/checkout@v4

      - name: 💾 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🧪 Run tests
        run: npm test
